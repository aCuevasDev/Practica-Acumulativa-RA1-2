<VirtualHost *:80>
    ServerName jukebox.test
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex views/form.html index.php index.html
    ErrorLog ${APACHE_LOG_DIR}/jukebox-error.log
    CustomLog ${APACHE_LOG_DIR}/jukebox-access.log combined
</VirtualHost>
name: asociacion-jukebox-multiservicio
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8091:80"
    volumes:
      # deprecated. binding made requests to files very slow
      - ../src:/var/www/html #practica pide ./src:/var/www/html pero no me gusta duplicar código, así que lo pongo apuntando a raíz
      - ../data:/var/www/data #fuera del docroot para que usuarios.json y songs.json no sean accesible por HTTP

    env_file:
      - .env
  mariadb:
    image: mariadb:11.1
    environment:
      - MARIADB_DATABASE=${MARIADB_NAME}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
  postgres:
    image: postgres:16.2
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  mariadb_data:

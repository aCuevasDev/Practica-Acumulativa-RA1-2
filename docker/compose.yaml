name: asociacion-jukebox-multiservicio
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:80"
    volumes:
      - ../src:/var/www/html #practica pide ./src:/var/www/html pero no me gusta duplicar código, así que lo pongo relativo a docker
    # data:
    #   - ./data:/var/www/html/data
    env_file:
      - .env
  db:
    image: mariadb:11.1
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
  db_postgres:
    image: postgres:16.2
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:

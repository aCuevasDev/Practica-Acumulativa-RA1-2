name: jukebox-php
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:80"
    volumes:
      - ./src:/var/www/html
    # data:
    #   - ./data:/var/www/html/data
    env_file:
      - .env
  db:
    image: mariadb:11.1
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:

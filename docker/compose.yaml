name: asociacion-jukebox-multiservicio
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:80"
    volumes:
      - ../src:/var/www/html #practica pide ./src:/var/www/html pero no me gusta duplicar código, así que lo pongo relativo a docker
      - ../data:/var/www/data #fuera del docroot para que usuarios.json no sea accesible por HTTP, se pedía también con songs.json pero como tengo la práctica de js metida dentro de src era más complejo de hacer
    # data:
    #   - ./data:/var/www/html/data
    env_file:
      - .env
  mariadb:
    image: mariadb:11.1
    environment:
      - MARIADB_DATABASE=${MARIADB_NAME}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
  postgres:
    image: postgres:16.2
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  mariadb_data:
